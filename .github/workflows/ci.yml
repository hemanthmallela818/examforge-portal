name: Continuous Integration & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, Test, Audit & Build Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Lint Verification
        run: npm run lint

      - name: JavaScript & JSX Project Verification
        run: npm run typecheck

      - name: Schema Reference Is Current
        run: npm run schema:reference:check

      - name: Component Behaviour Tests
        run: npm run test:components

      - name: Database Behaviour Tests (all migrations replayed)
        run: npm run test:db

      - name: Run Test Suite With Coverage Gates
        run: npm run test:coverage

      - name: Production Bundle Compilation (Vite)
        run: npm run build

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

  critical-browser-e2e:
    name: Local Supabase Critical Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Pinned Browser Runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Critical Authenticated Browser Paths
        run: npm run test:e2e:local -- e2e/auth.spec.mjs e2e/admin-critical.spec.mjs e2e/student-exam.spec.mjs e2e/takeover.spec.mjs e2e/axe.spec.mjs

      - name: Upload Browser Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Local Supabase Stack
        if: always()
        run: node scripts/run-supabase.mjs stop --no-backup
